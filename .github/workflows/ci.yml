name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --no-install-project --group dev
      - run: uv run --no-sync ruff check storage.py scripts
      - run: uv run --no-sync ruff format --check storage.py scripts
      - run: uv run --no-sync pytest tests/ -q

  gateway:
    runs-on: ubuntu-latest
    env:
      GATEWAY_TEST_POSTGRES_URL: postgres://omniretrive:ci-placeholder-not-a-secret@localhost:5432/omniretrive?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omniretrive
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          POSTGRES_DB: omniretrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniretrive -d omniretrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go test ./...
        working-directory: gateway
      - run: go vet ./...
        working-directory: gateway

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: observability-service/go.mod
          cache-dependency-path: observability-service/go.sum
      - run: go test ./...
        working-directory: observability-service
      - run: go vet ./...
        working-directory: observability-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
        working-directory: frontend-react
      - run: npm run build
        working-directory: frontend-react

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-placeholder-not-a-secret
      JWT_SECRET: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.backend
          - Dockerfile.gateway
          - Dockerfile.frontend
          - Dockerfile.observability
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
